name: Test SDK Manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y unzip git python3-pip python3-setuptools

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer

      - name: First spin-up
        run: |
          mkdir app
          echo "print('hello')" > app/main.py
          cd app
          buildozer init
          buildozer android debug || true

      - name: Locate SDK
        id: loc
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "sdk_dir=$SDK" >> $GITHUB_OUTPUT
          SM=$(find "$SDK" -type f -name sdkmanager -print -quit)
          echo "sdkmanager_path=$SM" >> $GITHUB_OUTPUT

      - name: Install Android SDK packages
        run: |
          yes | "${{ steps.loc.outputs.sdkmanager_path }}" --channel=0 --install "platform-tools" "platforms;android-33" "build-tools;34.0.0"
