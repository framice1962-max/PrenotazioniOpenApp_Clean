
name: Build APK (Ubuntu)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y unzip git python3-pip python3-setuptools \
            zlib1g-dev libffi-dev libssl-dev libltdl-dev \
            autoconf automake libtool pkg-config

      - name: Unzip project
        run: |
          test -f PrenotazioniOpenApp_clean_v1.zip || { echo 'ZIP PrenotazioniOpenApp_clean_v1.zip not found'; exit 1; }
          unzip -q PrenotazioniOpenApp_clean_v1.zip -d project
          echo '== project content =='; find project -maxdepth 2 -print

      - name: Detect buildozer.spec
        id: detect
        shell: bash
        run: |
          SPEC_PATH=$(find project -type f -name buildozer.spec -print -quit || true)
          [ -n "$SPEC_PATH" ] || { echo 'buildozer.spec not found in ZIP'; exit 1; }
          APP_DIR=$(dirname "$SPEC_PATH")
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "== tail spec =="
          tail -n +1 "$SPEC_PATH" | sed -n '1,120p'

      - name: Validate spec pins
        run: |
          SPEC_FILE="${{ steps.detect.outputs.app_dir }}/buildozer.spec"
          grep -E '^android.api *= *33$' "$SPEC_FILE" || { echo 'Missing android.api=33'; exit 1; }
          grep -E '^android.build_tools_version *= *34.0.0$' "$SPEC_FILE" || { echo 'Missing build_tools 34.0.0'; exit 1; }
          grep -E '^android.accept_sdk_license *= *True$' "$SPEC_FILE" || { echo 'Missing accept_sdk_license'; exit 1; }

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install Cython buildozer

      - name: First spin-up
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: buildozer android debug || true

      - name: Locate SDK and sdkmanager
        id: loc
        shell: bash
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          echo "sdk_dir=$SDK_DIR" >> "$GITHUB_OUTPUT"
          SM=""
          if [ -x "$SDK_DIR/tools/bin/sdkmanager" ]; then SM="$SDK_DIR/tools/bin/sdkmanager"; fi
          if [ -z "$SM" ]; then SM=$(find "$SDK_DIR" -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit || true); fi
          if [ -z "$SM" ]; then (cd "${{ steps.detect.outputs.app_dir }}" && buildozer android debug || true); fi
          if [ -z "$SM" ] && [ -x "$SDK_DIR/tools/bin/sdkmanager" ]; then SM="$SDK_DIR/tools/bin/sdkmanager"; fi
          if [ -z "$SM" ]; then SM=$(find "$SDK_DIR" -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit || true); fi
          [ -n "$SM" ] || { echo 'sdkmanager not found'; find "$SDK_DIR" -maxdepth 5 -print; exit 1; }
          echo "sdkmanager_path=$SM" >> "$GITHUB_OUTPUT"

      - name: Accept licenses
        run: |
          YES=yes
          "$YES" | "${{ steps.loc.outputs.sdkmanager_path }}" --licenses || true

      - name: Install Android packages (stable channel)
        run: |
          echo ">>> Install Android packages"
          yes | "${{ steps.loc.outputs.sdkmanager_path }}" \
            --channel=0 \
            --install \
            platform-tools \
            platforms;android-33 \
            build-tools;34.0.0

         - name: Verify AIDL
        run: |
          SDK_DIR="${{ steps.loc.outputs.sdk_dir }}"
          [ -x "$SDK_DIR/build-tools/34.0.0/aidl" ] || { echo 'aidl 34.0.0 missing'; exit 1; }
          ls -la "$SDK_DIR/build-tools" || true

      - name: Build APK (debug)
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: |
            ${{ steps.detect.outputs.app_dir }}/bin/*.apk
          if-no-files-found: error
